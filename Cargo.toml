[package]
name = "z80-rust-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A fast Rust Z80 core forked from z80-rust and kept provably equivalent to z80-python"
license = "MIT"
repository = "https://github.com/alewman/z80-rust-fast"
publish = false

[lib]
# The library keeps z80-rust's crate name so a host written for it compiles
# against this fork unchanged: `use z80_rust::{Bus, Z80}`.
name = "z80_rust"

[features]
default = ["std"]
# The instruction core needs nothing from std. `std` enables the trace
# producer, the conformance kit, the binaries, and the rung 1 test.
std = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "z80-trace"
required-features = ["std"]

[[bin]]
name = "z80-vectors"
required-features = ["std"]

[[bin]]
name = "z80-z80test"
required-features = ["std"]

[[bin]]
name = "z80-fuse"
required-features = ["std"]

[[bin]]
name = "z80-bench"
required-features = ["std"]

[[test]]
name = "rung1"
required-features = ["std"]

[profile.release]
debug = 1
# Build profile, applied after the source-level work so each earlier
# number stands: one codegen unit and fat LTO let LLVM see the core, the
# host, and the binary's loop as one unit.
codegen-units = 1
lto = "fat"
